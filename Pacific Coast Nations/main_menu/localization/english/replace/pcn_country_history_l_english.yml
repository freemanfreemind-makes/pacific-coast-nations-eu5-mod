 country_history_pcn: "The various nations of the pacific coast of north america were among the most advanced technologically in the americas. Dense settlements of 1000's to 10s of 1000's of residents dotted the coast and river systems from the California coast to Alaska.  Building masterful wooden buildings and boats, working metals including small amounts of iron, and building trade networks stretching along the coast; these strong resilient nations resisted colonial efforts well into the 19th century."



